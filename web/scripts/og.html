<!doctype html>
<!-- Social preview image (1200×630), rendered to public/og.png by scripts/og.mjs. -->
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <style>
      @font-face {
        font-family: 'Geist Pixel';
        src: url('../src/assets/fonts/GeistPixel-Square.woff2') format('woff2');
      }

      * {
        box-sizing: border-box;
        margin: 0;
      }

      body {
        --px: 6px;
        position: relative;
        width: 1200px;
        height: 630px;
        overflow: hidden;
        font-family: 'Geist Pixel', monospace;
        background: linear-gradient(
          to bottom,
          oklch(68% 0.14 240) 0 22%,
          oklch(74% 0.12 235) 22% 40%,
          oklch(80% 0.1 228) 40% 56%,
          oklch(86% 0.07 220) 56% 70%,
          oklch(92% 0.04 210) 70%
        );
      }

      img,
      .sprite {
        position: absolute;
        image-rendering: pixelated;
      }

      .title {
        position: absolute;
        left: 72px;
        top: 150px;
        font-size: 168px;
        line-height: 1;
        color: white;
        --o: 5px;
        --ink: oklch(30% 0.02 260);
        text-shadow:
          var(--o) 0 var(--ink), calc(var(--o) * -1) 0 var(--ink), 0 var(--o) var(--ink),
          0 calc(var(--o) * -1) var(--ink), var(--o) var(--o) var(--ink),
          calc(var(--o) * -1) calc(var(--o) * -1) var(--ink), var(--o) calc(var(--o) * -1) var(--ink),
          calc(var(--o) * -1) var(--o) var(--ink), 13px 13px 0 var(--ink);
      }

      /* The site's text box. */
      .box {
        position: absolute;
        left: 76px;
        top: 352px;
        padding: 18px 28px;
        font-size: 34px;
        color: oklch(30% 0.02 260);
        background: oklch(98% 0.01 95);
        border: 5px solid oklch(30% 0.02 260);
        border-radius: 10px;
        box-shadow:
          inset 0 0 0 5px oklch(98% 0.01 95),
          inset 0 0 0 10px oklch(62% 0.09 215),
          0 10px 0 oklch(0% 0 0 / 0.2);
      }

      /* Sea, foam, and the grass strip from the site's footer. */
      .ground {
        position: absolute;
        inset: auto 0 0;
        height: 120px;
        background:
          url('../public/sprites/grass.svg') 0 54px / calc(32 * 4px) calc(13 * 4px) repeat-x,
          linear-gradient(oklch(97% 0.02 220) 0 4px, transparent 0) 0 0 / 100% 80px no-repeat,
          linear-gradient(oklch(55% 0.17 255) 0 50%, oklch(65% 0.14 245) 50%) 0 0 / 100% 80px no-repeat,
          #4a8a46;
      }
    </style>
  </head>
  <body>
    <img src="../public/sprites/cloud-lg.svg" style="left: 760px; top: 60px; width: 384px" alt="" />
    <img src="../public/sprites/cloud-sm.svg" style="left: 560px; top: 24px; width: 160px" alt="" />
    <img src="../public/sprites/cloud-lg.svg" style="left: 980px; top: 300px; width: 256px" alt="" />
    <img src="../public/sprites/cloud-sm.svg" style="left: 36px; top: 40px; width: 192px" alt="" />
    <div
      class="sprite"
      style="left: 820px; top: 230px; width: calc(22 * 4px); height: calc(15 * 4px); background: url('../public/sprites/bird.svg') 0 0 / calc(88 * 4px) 100%"
    ></div>
    <div class="title">Dan Black</div>
    <div class="box">Software engineer in Denver</div>
    <div class="ground"></div>
    <img src="../public/sprites/sailboat.svg" style="left: 640px; bottom: 82px; width: calc(20 * 4px)" alt="" />
  </body>
</html>
